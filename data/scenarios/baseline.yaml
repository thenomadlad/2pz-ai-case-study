# Baseline assumptions for the v3 market model (src/baseline.py reads this). The app's what-if
# panel overrides levels in memory; it never edits this file.
assumptions:
  # Catchment = drive time a customer will travel to a lounge (typical traffic, not rush
  # hour). Evidence and caveats: data/seed/v3/SOURCES.md, "Catchment travel time".
  travel_time_minutes:
    low: 10     # core convenience trade area; nail top-ups are proximity-driven
    medium: 15  # BrightLocal 2014: ~14 min average for hair/beauty salons
    high: 20    # women travel ~5 min longer than men; loyal clients go further
  # Drive times use Mapbox's typical traffic at this local departure time (a weekday midday).
  # A weekday 18:00 (after-work peak, when salon demand is high) gives smaller catchments.
  isochrone_depart_at: "2026-10-13T12:00"
  # Competitors = each lounge's premium substitutes inside its 15-min catchment. Premium: Google
  # price level in comparable_price_levels; where Google has no price (most salons), reviews >= the
  # catchment median and rating >= premium_min_rating. Bedashing's own level is assumed (Google has
  # none for its lounges); revisit from its menu.
  bedashing_price_level: expensive
  comparable_price_levels: [expensive, very_expensive]
  premium_min_rating: 4.3
  # Substitutes = the most-reviewed premium salons that together hold this share of the
  # catchment's premium reviews (a fixed k covered 22% of reviews in Al Barsha but 66% elsewhere).
  competitor_coverage:
    low: 0.5
    medium: 0.6
    high: 0.7
  # ESTIMATE, to be replaced if a full sweep is ever run: share of premium reviews our search
  # finds where its circles are all full (Google's 20-result cap). Calibrated on the fully swept
  # Al Barsha tile: 28.6k of 43.7k = 0.66. An upper bound: that sweep missed salons too.
  search_recall: 0.66
  # Market size = women 15+ per ~2 km cell. WorldPop gives adults; its sex split is one national
  # ratio (33.6%) everywhere, so adults in OSM industrial land use (worker housing) get this
  # female share, and every other cell is rebalanced to keep each emirate's female total.
  # Calibrated on 13 Dubai labour-camp communities (DSC 2022): 5.5% female, population-weighted.
  worker_housing_female_share:
    low: 0.01     # the near-all-male camps (Jebel Ali Industrial 1-2, Muhaisnah 2: 0.1-0.9%)
    medium: 0.055
    high: 0.15    # mixed industrial areas (Al Quoz Industrial 2: 14%, DIP 1: 12%)
