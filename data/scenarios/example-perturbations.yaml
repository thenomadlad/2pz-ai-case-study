name: example-perturbations
# Demonstrates the three example perturbation kinds in isolation: a new hypothetical
# branch, relocating an existing branch, and re-rating an existing branch. contest_ratio
# is intentionally left at baseline's value (not overridden here) so these three branch/
# community overrides are the only things that differ from baseline -- that's what makes
# this an honest demonstration of "here's what these specific changes do," rather than a
# combination whose effects can't be individually attributed.
#
# Even with only these three overrides, OTHER branches may also shift action (not just
# the three touched here). This is because the rubric ranks every branch relative to the
# whole network -- changing one branch's standing (new branch added, al-safa-2 relocated)
# can shift where the top/bottom-third tier boundaries fall for everyone else. That's an
# honest property of the model, not a bug -- don't be surprised if branches you didn't
# touch show up in the diff too.
assumptions:
  model_backend: rubric  # free, instant, deterministic -- see docs/designs/v1.md
overrides:
  branches:
    # New hypothetical branch -- an id not in the seed data, so apply.py treats
    # it as a brand new entity rather than a patch. rating/review_count/
    # avg_price_aed are left out and default to null; source defaults to
    # "scenario" rather than "seed".
    dubai-marina-new:
      name: "Hypothetical Dubai Marina Branch"
      lat: 25.0805
      lng: 55.1403
      area: "Dubai Marina"

    # Relocate an existing real branch (al-safa-2) from its real coordinates
    # near Al Safa 2 to Deira's coordinates -- "what if this branch were in
    # Deira instead." Only lat/lng are patched; everything else about the
    # branch (name, rating, etc.) stays whatever baseline has.
    al-safa-2:
      lat: 25.2697
      lng: 55.3095

    # Rating change on an existing real branch (jumeirah-park), currently
    # rated 4.8 (second only to palm-jumeirah's 4.9) -- "what if reviews got
    # worse."
    jumeirah-park:
      rating: 3.9
