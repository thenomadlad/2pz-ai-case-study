[project]
name = "bedashing-right-sizing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "anthropic>=1.8",
    "pyyaml>=6.0",
    "streamlit>=1.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "pandas>=3.0.6",
    "rasterio>=1.4.4",
    "scipy>=1.17.1",
    "shapely>=2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
